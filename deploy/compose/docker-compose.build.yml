# Construire les images depuis les sources au lieu de les tirer de ghcr.io :
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env up -d --build
services:
  api:
    image: savoire-api:local
    build:
      context: ../..
      dockerfile: backend/Dockerfile
  indexer:
    image: savoire-indexer:local
    build:
      context: ../..
      dockerfile: apps/indexer/Dockerfile
  # Le store : depot voisin (STORE_SOURCE, par defaut a cote de Savoire).
  store:
    image: savoire-store:local
    build:
      context: ${STORE_SOURCE:-../../../SavoireStore}
      dockerfile: Dockerfile
  web:
    image: savoire-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
  zitadel-login:
    image: savoire-login:local
    build:
      context: ./zitadel-login
      args:
        ZITADEL_VERSION: ${ZITADEL_VERSION:-v4.16.0}
