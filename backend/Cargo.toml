[package]
name = "savoire-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Serveur Savoire : API REST, temps reel (WebSocket) et API ouverte."

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
futures = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
libc = "0.2.191"
rand = "0.9"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
urlencoding = "2.1.3"

[profile.release]
lto = "thin"
strip = true
