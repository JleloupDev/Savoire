#
# Images de Savoire (ADR-028, etape A) : tests du backend sur PostgreSQL, puis
# les images publiees sur ghcr.io (api, web, indexer, login, store).
# Le store (dossier store/) vit ici pour l'instant ; il aura son depot plus tard. Les memes images
# servent partout : auto-hebergement, production (deploy/compose).
#
# Etiquettes : « latest » (master), « sha-<commit> », et pour une etiquette
# git v1.2.3 : « v1.2.3 » et « v1.2 ». Chaque etiquette couvre x86 (amd64) et
# ARM (arm64) : docker choisit seul la bonne sur le serveur.
name: Images

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Tests du backend (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Une base neuve par test (backend/tests/common/mod.rs).
      SAVOIRE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build --locked --all-targets
      - run: cargo test --locked

  store-tests:
    name: Tests du store (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SAVOIRE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: store/global.json
      - run: dotnet test

  # Chaque image est construite deux fois, sur une machine native : x86 (amd64)
  # et ARM (arm64). Pas d'emulation : le backend Rust y prendrait des heures.
  # Chaque construction pousse son image sans etiquette ; le job « publish »
  # les reunit ensuite sous les etiquettes (latest, sha-..., v...).
  build:
    name: Image ${{ matrix.name }} (${{ matrix.arch }})
    needs: [backend-tests, store-tests]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [api, web, indexer, login, store]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { name: api, dockerfile: backend/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: indexer, dockerfile: apps/indexer/Dockerfile }
          # Page de connexion (Zitadel retouche) : son dossier suffit.
          - name: login
            context: deploy/compose/zitadel-login
            dockerfile: deploy/compose/zitadel-login/Dockerfile
          - name: store
            context: store
            dockerfile: store/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Nom de l'image (ghcr.io exige des minuscules)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/savoire-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      # Commit et date, affiches dans l'en-tete de l'appli web.
      - id: commit
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SAVOIRE_COMMIT=${{ github.sha }}
            SAVOIRE_COMMIT_DATE=${{ steps.commit.outputs.date }}
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Garder l'empreinte
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Une image n'est etiquetee que si ses deux architectures sont construites :
  # « latest » ne pointe jamais vers une image x86 seule.
  publish:
    name: Publier ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [api, web, indexer, login, store]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.name }}-*
          path: digests
          merge-multiple: true

      - name: Nom de l'image (ghcr.io exige des minuscules)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/savoire-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Reunir amd64 et arm64 sous les etiquettes
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          for f in digests/*; do args+=("$IMAGE@$(cat "$f")"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
