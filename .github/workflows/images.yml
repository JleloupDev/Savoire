#
# Images de Savoire (ADR-028, etape A) : tests du backend sur PostgreSQL, puis
# les trois images publiees sur ghcr.io (api, web, indexer). Les memes images
# servent partout : auto-hebergement, production (deploy/compose).
#
# Etiquettes : « latest » (master), « sha-<commit> », et pour une etiquette
# git v1.2.3 : « v1.2.3 » et « v1.2 ».
name: Images

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Tests du backend (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Une base neuve par factory de test (tests/Server.Integration.Tests/AppFactory.cs).
      SAVOIRE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build savoire.sln --configuration Release
      - run: dotnet test tests/Server.Unit.Tests --configuration Release --no-build
      - run: dotnet test tests/Server.Architecture.Tests --configuration Release --no-build
      - run: dotnet test tests/Server.Integration.Tests --configuration Release --no-build

  images:
    name: Image ${{ matrix.name }}
    needs: backend-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: backend/Savoire.API/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: indexer
            dockerfile: apps/indexer/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Nom de l'image (ghcr.io exige des minuscules)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/savoire-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
