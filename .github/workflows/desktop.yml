#
# Version bureau (Tauri 2) : compilee sur un vrai Linux, un vrai macOS et un
# vrai Windows a chaque push qui touche le front, et a la demande. Les
# installeurs sont joints au lancement (onglet Actions > le lancement >
# Artifacts). Un tag v* publie en plus une Release avec les installeurs.
# Android (serveur seulement) : un APK de debug, joint au lancement, hors Release.
#
# Rien ici ne connait de serveur : l'appli joint par defaut le backend local
# (http://127.0.0.1:5000, par tunnel SSH).
#
# Mises a jour (tag v* seulement) : la version vient du tag, les fichiers sont
# signes par la cle des mises a jour (secret TAURI_SIGNING_PRIVATE_KEY, et
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD si elle en a un), la cle publique
# (variable TAURI_UPDATER_PUBKEY) entre dans l'appli. La Release porte des
# noms fixes et latest.json (scripts/release-assets.mjs). Les paquets ne sont
# pas signes pour Windows ni macOS (avertissement au premier lancement).
name: Desktop

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      # Windows : chemins longs (node_modules profonds).
      - name: Chemins longs (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm
        run: npm install -g pnpm@11

      - name: Bibliotheques systeme (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Dependances front
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Tests Rust
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ../test.log

      - name: Construire
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          SAVOIRE_UPDATER_PUBKEY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.TAURI_UPDATER_PUBKEY || '' }}
        run: |
          set -o pipefail
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Sans la cle, l'appli publiee ne se mettrait jamais a jour.
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$SAVOIRE_UPDATER_PUBKEY" ]; then
              echo "::error::Release sans cle de mise a jour : secret TAURI_SIGNING_PRIVATE_KEY et variable TAURI_UPDATER_PUBKEY requis."
              exit 1
            fi
            # Version du tag (v1.2.3 -> 1.2.3) ; MSI n'accepte que des chiffres.
            args=(--config "{\"version\":\"${GITHUB_REF_NAME#v}\",\"bundle\":{\"createUpdaterArtifacts\":true}}")
          fi
          pnpm run tauri:build "${args[@]}" 2>&1 | tee build.log

      # Les journaux d'Actions demandent un compte GitHub : la fin du journal
      # d'un echec part aussi en annotation, lisible par l'API publique.
      - name: Fin du journal en cas d'echec
        if: failure()
        shell: bash
        working-directory: apps/desktop
        run: |
          for log in test.log build.log; do
            [ -f "$log" ] || continue
            msg=$(tail -n 60 "$log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${log} (${{ matrix.name }})::${msg}"
          done

      - name: Installeurs
        uses: actions/upload-artifact@v7
        with:
          name: savoire-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/*/*.sig

  # Android : serveur seulement (pas de dossier de vault). Le projet Android
  # (src-tauri/gen/android, ignore par git) est genere a chaque fois.
  # APK de debug : signe par la cle de debug, donc installable tel quel, et
  # il laisse passer le http en clair vers http://127.0.0.1:5000 (tunnel SSH
  # sur le telephone). Une version release demandera une cle de signature.
  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm
        run: npm install -g pnpm@11

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # SDK et NDK Android deja presents sur l'image Ubuntu de GitHub.
      - name: NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-android-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-android-

      - name: Dependances front
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Construire
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri android init --ci 2>&1 | tee build.log
          pnpm tauri android build --debug --apk --target aarch64 2>&1 | tee -a build.log

      - name: Fin du journal en cas d'echec
        if: failure()
        shell: bash
        working-directory: apps/desktop
        run: |
          [ -f build.log ] || exit 0
          msg=$(tail -n 60 build.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=tauri android build::${msg}"

      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: savoire-Android
          if-no-files-found: error
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/desktop/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: savoire-{Linux,macOS,Windows}
          path: dist
      # Noms fixes (bouton de telechargement) et latest.json (mises a jour).
      - name: Fichiers de la Release
        run: node apps/desktop/scripts/release-assets.mjs dist release "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "Savoire ${GITHUB_REF_NAME}"
