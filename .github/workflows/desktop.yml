#
# Version bureau (Tauri 2) : compilee sur un vrai Linux, un vrai macOS et un
# vrai Windows a chaque push qui touche le front, et a la demande. Les
# installeurs sont joints au lancement (onglet Actions > le lancement >
# Artifacts). Un tag v* publie en plus une Release avec les installeurs.
#
# Rien ici ne connait de serveur : l'appli joint par defaut le backend local
# (http://127.0.0.1:5000, par tunnel SSH). Paquets non signes.
name: Desktop

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      # Windows : chemins longs (node_modules profonds).
      - name: Chemins longs (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm
        run: npm install -g pnpm@11

      - name: Bibliotheques systeme (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Dependances front
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Tests Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Construire
        working-directory: apps/desktop
        run: pnpm run tauri:build

      - name: Installeurs
        uses: actions/upload-artifact@v7
        with:
          name: savoire-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "Savoire ${GITHUB_REF_NAME}"
