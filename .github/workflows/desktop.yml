#
# Version bureau (Tauri 2) : compilee sur un vrai Linux, un vrai macOS et un
# vrai Windows a chaque push qui touche le front, et a la demande. Les
# installeurs sont joints au lancement (onglet Actions > le lancement >
# Artifacts). Un tag v* publie en plus une Release avec les installeurs.
# Android (serveur seulement) : un APK de debug, joint au lancement, hors Release.
#
# Rien ici ne connait de serveur : l'appli joint par defaut le backend local
# (http://127.0.0.1:5000, par tunnel SSH). Paquets non signes.
name: Desktop

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      # Windows : chemins longs (node_modules profonds).
      - name: Chemins longs (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm
        run: npm install -g pnpm@11

      - name: Bibliotheques systeme (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Dependances front
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Tests Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Construire
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          pnpm run tauri:build 2>&1 | tee build.log

      # Les journaux d'Actions demandent un compte GitHub : la fin du journal
      # d'un echec part aussi en annotation, lisible par l'API publique.
      - name: Fin du journal en cas d'echec
        if: failure()
        shell: bash
        working-directory: apps/desktop
        run: |
          [ -f build.log ] || exit 0
          msg=$(tail -n 60 build.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=tauri build (${{ matrix.name }})::${msg}"

      - name: Installeurs
        uses: actions/upload-artifact@v7
        with:
          name: savoire-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  # Android : serveur seulement (pas de dossier de vault). Le projet Android
  # (src-tauri/gen/android, ignore par git) est genere a chaque fois.
  # APK de debug : signe par la cle de debug, donc installable tel quel, et
  # il laisse passer le http en clair vers http://127.0.0.1:5000 (tunnel SSH
  # sur le telephone). Une version release demandera une cle de signature.
  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm
        run: npm install -g pnpm@11

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # SDK et NDK Android deja presents sur l'image Ubuntu de GitHub.
      - name: NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-android-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-android-

      - name: Dependances front
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Construire
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri android init --ci 2>&1 | tee build.log
          pnpm tauri android build --debug --apk --target aarch64 2>&1 | tee -a build.log

      - name: Fin du journal en cas d'echec
        if: failure()
        shell: bash
        working-directory: apps/desktop
        run: |
          [ -f build.log ] || exit 0
          msg=$(tail -n 60 build.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=tauri android build::${msg}"

      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: savoire-Android
          if-no-files-found: error
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "Savoire ${GITHUB_REF_NAME}"
