server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets hashés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
