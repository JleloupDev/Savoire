#
# Les serveurs Savoire connus et leurs sessions : deux fichiers fixes du
# dossier de configuration de l'application (voir src/servers.rs).

[[set]]
identifier = "server"
description = "Lire et choisir les serveurs Savoire connus, garder la session de chacun."
permissions = [
  "allow-server-list",
  "allow-server-select",
  "allow-server-forget",
  "allow-server-session-get",
  "allow-server-session-set",
]

# Connexion a un serveur (ADR-028) : le navigateur du systeme s'ouvre sur la
# page de connexion, le retour arrive sur 127.0.0.1 (voir src/oauth.rs).
[[set]]
identifier = "server-login"
description = "Se connecter a un serveur dans le navigateur du systeme (retour sur 127.0.0.1)."
permissions = [
  "allow-oauth-listen",
  "allow-oauth-wait",
  "allow-open-external",
]
