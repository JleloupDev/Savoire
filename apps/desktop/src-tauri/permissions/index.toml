#
# L'index SQLite d'un vault ouvert (.savoire/index.sqlite) : seulement pour
# une racine autorisee, sans pouvoir attacher d'autre fichier (voir
# src/index_db.rs).

[[set]]
identifier = "index"
description = "Lire et ecrire l'index SQLite des vaults ouverts (.savoire/index.sqlite)."
permissions = [
  "allow-index-exec",
  "allow-index-all",
  "allow-index-batch",
  "allow-index-close",
]
